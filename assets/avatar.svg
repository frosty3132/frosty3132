<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
<defs><radialGradient id="bg" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#1e0a3f"/><stop offset="1" stop-color="#07021a"/></radialGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6ec7"/><stop offset="0.5" stop-color="#b98cff"/><stop offset="1" stop-color="#5ef2ff"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="2" fill="#b98cff" opacity=".18"/></pattern>
</defs>
<rect width="1000" height="1000" fill="url(#bg)"/>
<rect width="1000" height="1000" fill="url(#dots)"/>
<circle cx="500" cy="500" r="390" fill="none" stroke="url(#g)" stroke-width="5" opacity=".55"/>
<polyline points="300,350 460,500 300,650" fill="none" stroke="url(#g)" stroke-width="70" stroke-linejoin="miter" stroke-linecap="square" filter="url(#glow)"/>
<rect x="520" y="600" width="190" height="60" fill="#5ef2ff" filter="url(#glow)"/>
</svg>
